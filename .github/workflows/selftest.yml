name: Self-test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions: {}

jobs:
  selftest:
    name: "TEST: basic selftest"
    strategy:
      fail-fast: true
      matrix:
        # ubuntu-slim has no Docker daemon, but it does ship Python.
        os: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-slim]
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write

    steps:
      - uses: $/
        with:
          advanced-security: true
          inputs: ${{ github.repository }}

  selftest-version:
    name: "TEST: zizmor version ${{ matrix.version }}"
    strategy:
      matrix:
        version: ["1.29.0", "v1.29.0", "latest"]
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    steps:
      - uses: $/
        with:
          advanced-security: true
          version: ${{ matrix.version }}
          inputs: ${{ github.repository }}

  selftest-version-nonexistent-xfail:
    name: "TEST: nonexistent version of zizmor (expected to fail)"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: true
          version: "9999.0.0"
          inputs: ${{ github.repository }}

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-plain:
    name: "TEST: emits plan format when 'advanced-security: false'"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        with:
          advanced-security: false
          inputs: ${{ github.repository }}

  selftest-plain-gha-hazmat-xfail:
    name: "TEST: known findings in woodruffw/gha-hazmat (expected to fail when 'advanced-security: false')"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: "woodruffw/gha-hazmat"

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-plain-gha-hazmat-offline-audits-xfail:
    name: "TEST: known findings in woodruffw/gha-hazmat with offline audits (expected to fail when 'advanced-security: false')"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: "woodruffw/gha-hazmat"
          online-audits: false

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-annotations:
    name: "TEST: 'annotations: true' emits GitHub annotations"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        with:
          advanced-security: false
          annotations: true
          inputs: ${{ github.repository }}

  selftest-annotations-advanced-security-exclusive-xfail:
    name: "TEST: 'annotations: true' and 'advanced-security: true' are mutually exclusive"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: true
          annotations: true
          inputs: ${{ github.repository }}

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-checks:
    name: "TEST: Checks with ${{ matrix.findings }} findings"
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      matrix:
        include:
          - findings: 0
            check-name: zizmor selftest
          - findings: 51
            check-name: zizmor selftest (xfail)
    runs-on: ubuntu-slim
    permissions:
      checks: write
    env:
      CHECK_NAME: ${{ matrix.check-name }}
    steps:
      - name: Prepare workflow to audit
        env:
          FINDINGS: ${{ matrix.findings }}
        run: |
          cat > checks-selftest.yml <<'EOF'
          on: issues
          permissions: {}
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo safe
          EOF
          for ((i = 0; i < FINDINGS; i++)); do
            # Split the expression so the runner does not interpolate it here.
            printf '%s%s\n' '      - run: echo $' '{{ github.event.issue.title }}' >> checks-selftest.yml
          done

      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          checks: true
          internal-checks-name: ${{ env.CHECK_NAME }}
          inputs: checks-selftest.yml
          online-audits: false
          min-severity: high

      - name: Assert check conclusion and annotation count
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ matrix.findings }}
          OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          expected=success
          if [[ "${FINDINGS}" -gt 0 ]]; then expected=failure; fi
          [[ "${OUTCOME}" == "${expected}" ]]
          # GitHub replaces details_url on checks created with GITHUB_TOKEN.
          # The API defaults to the latest check per name; each case has its own name.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            | jq -e --arg name "${CHECK_NAME}" \
                --arg conclusion "${expected}" --argjson count "${FINDINGS}" '
                [.check_runs[] | select(.name == $name)] |
                length == 1 and (.[0] | .status == "completed" and
                    .conclusion == $conclusion and .output.annotations_count == $count)'

  selftest-checks-invalid-xfail:
    name: "TEST: Checks rejects incompatible modes"
    strategy:
      matrix:
        mode: [advanced-security, annotations]
    runs-on: ubuntu-slim
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          checks: true
          internal-checks-name: zizmor selftest (invalid xfail)
          advanced-security: ${{ matrix.mode == 'advanced-security' }}
          annotations: ${{ matrix.mode == 'annotations' }}

      - name: Assert failure
        env:
          OUTCOME: ${{ steps.zizmor.outcome }}
        run: test "${OUTCOME}" = failure

  selftest-checks-permission-xfail:
    name: "TEST: Checks requires write permission"
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Prepare clean workflow to audit
        run: |
          cat > checks-selftest.yml <<'EOF'
          on: push
          permissions: {}
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo safe
          EOF

      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          checks: true
          internal-checks-name: zizmor selftest (permission xfail)
          inputs: checks-selftest.yml
          online-audits: false

      - name: Assert failure
        env:
          OUTCOME: ${{ steps.zizmor.outcome }}
        run: test "${OUTCOME}" = failure

  selftest-fail-on-no-inputs-xfail:
    name: "TEST: 'fail-on-no-inputs: true' causes failure when no inputs are collected"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: woodruffw-experiments/empty

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-fail-on-no-inputs-disabled:
    name: "TEST: 'fail-on-no-inputs: false' does not cause failure when no inputs are collected"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: woodruffw-experiments/empty
          fail-on-no-inputs: false

  selftest-output-file-output-is-present-when-advanced-security:
    name: "TEST: 'outputs.output-file' is present when `advanced-security: true`"
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: $/
        id: zizmor
        with:
          advanced-security: true
          inputs: ${{ github.repository }}

      - name: Test output-file
        run: |
          jq < "${OUTPUT_FILE}"
        env:
          OUTPUT_FILE: ${{ steps.zizmor.outputs.output-file }}

  selftest-collect:
    name: "TEST: 'collect: actions` only collections action inputs"
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: $/
        id: zizmor
        with:
          advanced-security: false
          collect: actions
          inputs: ${{ github.repository }}

      # TODO: Would be nice to grep the input or similar here to confirm we only collected `./action.yml`.

  all-selftests-pass:
    if: always()

    needs:
      - selftest
      - selftest-version
      - selftest-version-nonexistent-xfail
      - selftest-plain
      - selftest-plain-gha-hazmat-xfail
      - selftest-plain-gha-hazmat-offline-audits-xfail
      - selftest-annotations
      - selftest-annotations-advanced-security-exclusive-xfail
      - selftest-checks
      - selftest-checks-invalid-xfail
      - selftest-checks-permission-xfail
      - selftest-fail-on-no-inputs-xfail
      - selftest-fail-on-no-inputs-disabled
      - selftest-output-file-output-is-present-when-advanced-security
      - selftest-collect

    runs-on: ubuntu-latest

    steps:
      - name: check test jobs
        if: (github.event_name != 'pull_request') || !github.event.pull_request.head.repo.fork
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: selftest-checks

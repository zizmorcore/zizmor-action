on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

name: Sync zizmor versions

permissions: {}

env:
  BRANCH_NAME: sync-zizmor-versions

jobs:
  sync-versions:
    name: Sync zizmor versions
    if: ${{ github.repository == 'zizmorcore/zizmor-action' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create PR branches
      pull-requests: write # to create PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.15"

      - name: Sync zizmor versions
        env:
          UV_LOCKED: "1"
        run: uv run ./support/sync-zizmor-versions.py

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true
          commit-message: Sync zizmor versions
          title: Sync zizmor versions
          body: |
            :robot: :warning: :robot:

            New releases of `zizmor` are available on PyPI.

            This PR refreshes the version groups in `support/pyproject.toml`,
            including the `zizmor-latest` and `zizmor-prerelease` aliases,
            and their hash-pinned requirements under `support/locks/`.

            Please review manually before merging.

            Cross-reference: <https://pypi.org/project/zizmor/>
          assignees: woodruffw
          draft: true

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

name: Sync zizmor versions

permissions: {}

env:
  BRANCH_NAME: sync-zizmor-versions

jobs:
  sync-versions:
    name: Sync zizmor versions
    if: ${{ github.repository == 'zizmorcore/zizmor-action' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create PR branches
      pull-requests: write # to create PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync zizmor versions
        run: ./support/sync-zizmor-versions.sh

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true
          commit-message: Sync zizmor versions
          title: Sync zizmor versions
          body: |
            :robot: :warning: :robot:

            A newer stable release of `zizmor` is available on PyPI.

            This PR refreshes the hash-pinned locks under `support/locks/` and
            `support/zizmor-version`, which is the version this action runs by
            default.

            Please review manually before merging.

            Cross-reference: <https://pypi.org/project/zizmor/>
          assignees: woodruffw
          draft: true

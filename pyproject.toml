# This project exists only to lock the default `zizmor` version that the
# action runs. Dependabot keeps the lock current; see `.github/dependabot.yml`.
#
# Nothing here is published or installed as a package.

[project]
name = "zizmor-action"
version = "0.0.0"
description = "Locks the default zizmor version used by zizmor-action"
requires-python = ">=3.10"
dependencies = ["zizmor==1.30.1"]

[tool.uv]
package = false
